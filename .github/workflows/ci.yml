name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 22 runs TypeScript directly (type stripping) and ships
          # node:sqlite, which is what keeps this project dependency-free.
          node-version: '22'
          cache: npm

      - name: Install dev tooling
        run: |
          node --version
          npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check shell syntax
        run: bash -n scripts/*.sh deploy/*.sh

      - name: Run ShellCheck
        run: shellcheck --severity=style --external-sources scripts/*.sh deploy/*.sh

      - name: Shell scripts must be executable
        # git only tracks the executable bit, so a script created without +x
        # arrives non-executable on a fresh clone — and the systemd unit calls
        # deploy/backup.sh directly, so that failure only shows up in production.
        run: |
          status=0
          for file in scripts/*.sh deploy/*.sh; do
            if [ ! -x "$file" ]; then
              echo "::error file=$file::$file is not executable"
              status=1
            fi
          done
          exit $status

  deploy:
    name: Deployment artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build the image
        # No build step in the usual sense: this proves the Dockerfile is valid
        # and that the unprivileged container can actually read its own sources.
        run: docker build -f deploy/Dockerfile -t story-core:ci .

      - name: The image only needs the manifest and src
        run: |
          docker run --rm --entrypoint sh story-core:ci -c '
            test -f /app/package.json || { echo "package.json missing"; exit 1; }
            test -d /app/src || { echo "src missing"; exit 1; }
            test ! -d /app/node_modules || { echo "node_modules leaked into the image"; exit 1; }
            test -r /app/src/server.ts || { echo "sources are not readable by the runtime user"; exit 1; }
          '

      - name: Actually run the backup script
        # The script is only meaningful if it produces a valid, verifiable
        # archive: `bash -n` and ShellCheck cannot see a tar invocation that is
        # wrong (gzip archives cannot be appended to, for one).
        #
        # Run from the deployment directory, which is how the README and the
        # systemd unit invoke it: the checksum file records paths relative to it.
        working-directory: deploy
        run: |
          cp .env.example .env
          mkdir -p data/chats
          printf '{}\n' > data/story.sqlite
          ./backup.sh

          archive="$(ls -1t backups/story-core-*.tar.gz | head -n1)"
          test -s "$archive"
          sha256sum --check "${archive}.sha256"
          tar -tzf "$archive" >/dev/null
          tar -tzf "$archive" | grep -qx 'data/story.sqlite'
          tar -tzf "$archive" | grep -qx '.env'
          test -z "$(find backups -name '*.partial' -print -quit)"

      - name: Rotation keeps the requested number of archives
        working-directory: deploy
        run: |
          BACKUP_KEEP=1 ./backup.sh
          BACKUP_KEEP=1 ./backup.sh
          test "$(find backups -maxdepth 1 -name 'story-core-*.tar.gz' | wc -l)" -eq 1

      - name: Validate the Compose file
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml config >/dev/null
          docker compose -f deploy/docker-compose.yml config --services | grep -qx story-core
          docker compose -f deploy/docker-compose.yml config --services | grep -qx caddy

      - name: Validate the Caddyfile
        run: |
          docker run --rm \
            -e APP_DOMAIN=chat.example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Streaming must not be buffered
        # The two ways to break SSE are gzipping event-stream and letting the
        # proxy buffer it; both are configuration, so both are asserted here.
        run: |
          grep -q 'flush_interval -1' deploy/Caddyfile
          if grep -A3 'encode' deploy/Caddyfile | grep -q 'text/event-stream'; then
            echo "the Caddyfile compresses text/event-stream, which breaks streaming"
            exit 1
          fi

  interop:
    name: Interop with real SillyTavern
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The input format is owned by another project, so the only meaningful test
      # of it is against that project. If the image cannot be fetched the check is
      # skipped rather than failed: a registry outage is not a regression here.
      - name: Pull the SillyTavern image
        id: image
        run: |
          if docker pull ghcr.io/sillytavern/sillytavern:latest; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::could not pull the SillyTavern image, skipping the interop check"
          fi

      - name: Start SillyTavern
        if: steps.image.outputs.available == 'true'
        run: |
          docker run -d --name st ghcr.io/sillytavern/sillytavern:latest
          for _ in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Running}}' st)" = "true" ]; then
              break
            fi
            sleep 2
          done
          docker inspect -f 'running={{.State.Running}}' st

      - name: Write a card with this project and read it back with SillyTavern
        if: steps.image.outputs.available == 'true'
        run: |
          mkdir -p /tmp/lib
          printf '%s' '{"spec":"chara_card_v2","data":{"name":"CI Interop","description":"written by story-core, parsed by SillyTavern","first_mes":"hi"}}' > /tmp/card.json

          STORY_LIBRARY_ROOT=/tmp/lib node --disable-warning=ExperimentalWarning \
            src/cli.ts import /tmp/card.json

          ./scripts/verify-with-sillytavern.sh --library /tmp/lib --container st

      - name: Container logs on failure
        if: failure()
        run: docker logs st 2>&1 | tail -50 || true
