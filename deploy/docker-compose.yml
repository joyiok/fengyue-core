name: story-core

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  story-core:
    build:
      # The build context is the repository root, so the Dockerfile can copy
      # src/ and package.json exactly as they are in the checkout.
      context: ..
      dockerfile: deploy/Dockerfile
    image: "${STORY_IMAGE:-story-core:local}"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    # Run as the owner of ./data, so the SQLite database and every user's
    # library stay readable by the backup script instead of being root-owned.
    user: "${PUID:-1000}:${PGID:-1000}"
    # The application never writes outside /data: state lives there, and the
    # rest of the filesystem is read-only. /tmp is a tmpfs because Node may
    # still want a scratch directory.
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      # That is the whole list. Application configuration — the model gateway,
      # quotas, credits, the market, memory — lives in the `settings` table and
      # is edited in the admin UI or with `src/cli.ts settings set`, so none of
      # it needs a rebuild or a restart. The image's own ENV supplies the seed
      # values a fresh database starts from (see deploy/Dockerfile and
      # src/settings/schema.ts).
    volumes:
      - ./data:/data:rw
    ports:
      # Loopback only. Caddy reaches the service over the compose network, so
      # this is purely for `curl` on the host.
      - "${STORY_LOCAL_PORT:-127.0.0.1:8787}:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging: *default-logging
    networks:
      - app

  # The web client. Stateless: it renders the UI and, outside production
  # routing, forwards /api to story-core. Here Caddy talks to story-core for
  # /api directly (see the Caddyfile), so this container only ever serves pages.
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    image: "${STORY_WEB_IMAGE:-story-web:local}"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    # The app writes nothing except Next's own build cache, which is mounted as
    # a tmpfs below. Everything else stays read-only.
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    stop_grace_period: 30s
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      # Used only by the dev-mode proxy route; in this stack Caddy owns /api.
      STORY_API_BASE: "http://story-core:8787"
    ports:
      # Loopback only, for `curl` on the host. Caddy reaches it over the network.
      - "${WEB_LOCAL_PORT:-127.0.0.1:3000}:3000"
    depends_on:
      story-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging: *default-logging
    networks:
      - app

  caddy:
    image: "${CADDY_IMAGE:-caddy:2-alpine}"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    # Unprivileged, like the app: nothing Caddy writes is root-owned, so the
    # backup script can read the certificates. Docker sets
    # net.ipv4.ip_unprivileged_port_start=0 inside containers, so this can
    # still bind 80/443.
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s
    depends_on:
      story-core:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      APP_DOMAIN: "${APP_DOMAIN:-:80}"
      CADDY_EMAIL: "${CADDY_EMAIL:-}"
      TZ: "${TZ:-Asia/Shanghai}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    logging: *default-logging
    networks:
      - app

networks:
  app:
    driver: bridge
