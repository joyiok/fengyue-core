name: story-core

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  story-core:
    build:
      # The build context is the repository root, so the Dockerfile can copy
      # src/ and package.json exactly as they are in the checkout.
      context: ..
      dockerfile: deploy/Dockerfile
    image: "${STORY_IMAGE:-story-core:local}"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    # Run as the owner of ./data, so the SQLite database and every user's
    # library stay readable by the backup script instead of being root-owned.
    user: "${PUID:-1000}:${PGID:-1000}"
    # The application never writes outside /data: state lives there, and the
    # rest of the filesystem is read-only. /tmp is a tmpfs because Node may
    # still want a scratch directory.
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      # Accounts. With accounts on, every library lives in <data>/users/<id>/
      # and every data route needs a token or a session cookie.
      STORY_AUTH: "${STORY_AUTH:-on}"
      STORY_ALLOW_REGISTRATION: "${STORY_ALLOW_REGISTRATION:-on}"
      STORY_SESSION_TTL_DAYS: "${STORY_SESSION_TTL_DAYS:-30}"

      # Model gateway (OpenAI-compatible). Empty until an operator fills them.
      STORY_MODEL_ENDPOINT: "${STORY_MODEL_ENDPOINT:-}"
      STORY_MODEL_NAME: "${STORY_MODEL_NAME:-}"
      STORY_MODEL_API_KEY: "${STORY_MODEL_API_KEY:-}"
      STORY_MODEL_MAX_TOKENS: "${STORY_MODEL_MAX_TOKENS:-2048}"
      STORY_MODEL_TIMEOUT_MS: "${STORY_MODEL_TIMEOUT_MS:-120000}"

      # The operator's ceiling: tokens per day/month, per request, and a
      # service-wide circuit breaker. 0 means unlimited.
      STORY_DAILY_TOKENS: "${STORY_DAILY_TOKENS:-200000}"
      STORY_MONTHLY_TOKENS: "${STORY_MONTHLY_TOKENS:-3000000}"
      STORY_MAX_TOKENS_PER_REQUEST: "${STORY_MAX_TOKENS_PER_REQUEST:-2048}"
      STORY_GLOBAL_DAILY_TOKENS: "${STORY_GLOBAL_DAILY_TOKENS:-0}"
      STORY_MAX_STREAMS: "${STORY_MAX_STREAMS:-2}"

      # Credits and the character market.
      STORY_CREDITS_SIGNUP: "${STORY_CREDITS_SIGNUP:-100}"
      STORY_CREDITS_CHECKIN: "${STORY_CREDITS_CHECKIN:-10}"
      STORY_CREDITS_INVITE: "${STORY_CREDITS_INVITE:-50}"
      STORY_CREDITS_INVITEE: "${STORY_CREDITS_INVITEE:-50}"
      STORY_TOKENS_PER_CREDIT: "${STORY_TOKENS_PER_CREDIT:-1000}"
      STORY_MARKET: "${STORY_MARKET:-on}"

      # Rolling summary memory.
      STORY_MEMORY: "${STORY_MEMORY:-on}"
      STORY_MEMORY_THRESHOLD: "${STORY_MEMORY_THRESHOLD:-40}"
      STORY_MEMORY_KEEP_RECENT: "${STORY_MEMORY_KEEP_RECENT:-12}"
      STORY_MEMORY_MAX_TOKENS: "${STORY_MEMORY_MAX_TOKENS:-500}"
    volumes:
      - ./data:/data:rw
    ports:
      # Loopback only. Caddy reaches the service over the compose network, so
      # this is purely for `curl` on the host.
      - "${STORY_LOCAL_PORT:-127.0.0.1:8787}:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging: *default-logging
    networks:
      - app

  # The web client. Stateless: it renders the UI and, outside production
  # routing, forwards /api to story-core. Here Caddy talks to story-core for
  # /api directly (see the Caddyfile), so this container only ever serves pages.
  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    image: "${STORY_WEB_IMAGE:-story-web:local}"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    # The app writes nothing except Next's own build cache, which is mounted as
    # a tmpfs below. Everything else stays read-only.
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    stop_grace_period: 30s
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      # Used only by the dev-mode proxy route; in this stack Caddy owns /api.
      STORY_API_BASE: "http://story-core:8787"
    ports:
      # Loopback only, for `curl` on the host. Caddy reaches it over the network.
      - "${WEB_LOCAL_PORT:-127.0.0.1:3000}:3000"
    depends_on:
      story-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging: *default-logging
    networks:
      - app

  caddy:
    image: "${CADDY_IMAGE:-caddy:2-alpine}"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    # Unprivileged, like the app: nothing Caddy writes is root-owned, so the
    # backup script can read the certificates. Docker sets
    # net.ipv4.ip_unprivileged_port_start=0 inside containers, so this can
    # still bind 80/443.
    user: "${PUID:-1000}:${PGID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 30s
    depends_on:
      story-core:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      APP_DOMAIN: "${APP_DOMAIN:-:80}"
      CADDY_EMAIL: "${CADDY_EMAIL:-}"
      TZ: "${TZ:-Asia/Shanghai}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    logging: *default-logging
    networks:
      - app

networks:
  app:
    driver: bridge
